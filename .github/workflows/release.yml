name: Release

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Deployment target
                required: true
                default: production
                type: choice
                options:
                    - production
                    - staging

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.environment }}
    queue: max

jobs:
    release:
        name: Deploy ${{ inputs.environment }}
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        environment:
            name: ${{ inputs.environment }}
            url: ${{ inputs.environment == 'production' && 'https://maxremy.dev' || 'https://staging.minimal-portfolio.pages.dev' }}

        steps:
            - name: Check out the release commit
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.13.1

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install browsers for production checks
              run: pnpm exec playwright install --with-deps chromium webkit

            - name: Validate the static build
              run: pnpm verify:production

            - name: Prepare release notes
              if: inputs.environment == 'production'
              env:
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  git fetch --force --tags origin

                  version="$(node --input-type=module --eval 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version);')"
                  if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                    echo "package.json must contain a valid semantic version. Received: $version" >&2
                    exit 1
                  fi

                  release_tag="v$version"
                  if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
                    echo "$release_tag already exists. Bump package.json before deploying production." >&2
                    exit 1
                  fi

                  previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
                  if [[ -n "$previous_tag" ]]; then
                    commit_range="$previous_tag..$GITHUB_SHA"
                    comparison_url="https://github.com/$REPOSITORY/compare/$previous_tag...$release_tag"
                  else
                    commit_range="$GITHUB_SHA"
                    comparison_url="https://github.com/$REPOSITORY/commits/$release_tag"
                  fi

                  {
                    printf '# %s\n\n' "$release_tag"
                    printf 'Production deployment: https://maxremy.dev\n\n'
                    printf '## Commits\n\n'
                    git log --format='%H%x09%s' "$commit_range" | while IFS=$'\t' read -r commit_hash subject; do
                      short_hash="${commit_hash:0:7}"
                      printf -- '- [%s](https://github.com/%s/commit/%s) %s\n' "$short_hash" "$REPOSITORY" "$commit_hash" "$subject"
                    done
                    printf '\n[Full comparison](%s)\n' "$comparison_url"
                  } > release-notes.md

                  {
                    printf 'RELEASE_TAG=%s\n' "$release_tag"
                    printf 'PREVIOUS_TAG=%s\n' "$previous_tag"
                  } >> "$GITHUB_ENV"

            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  DEPLOYMENT_BRANCH: ${{ inputs.environment == 'production' && 'main' || 'staging' }}
              run: |
                  pnpm dlx wrangler@4.116.0 pages deploy dist \
                    --project-name=minimal-portfolio \
                    --branch="$DEPLOYMENT_BRANCH" \
                    --commit-hash="$GITHUB_SHA" \
                    --commit-message="GitHub Actions run $GITHUB_RUN_ID"

            - name: Verify the deployment
              env:
                  DEPLOYMENT_URL: ${{ inputs.environment == 'production' && 'https://maxremy.dev' || 'https://staging.minimal-portfolio.pages.dev' }}
              run: pnpm verify:cloudflare "$DEPLOYMENT_URL"

            - name: Create the GitHub release
              if: inputs.environment == 'production'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$RELEASE_TAG" \
                    --target "$GITHUB_SHA" \
                    --title "$RELEASE_TAG" \
                    --notes-file release-notes.md \
                    --latest

            - name: Bump the next patch version
              if: inputs.environment == 'production'
              run: |
                  set -euo pipefail

                  pnpm version patch --no-git-tag-version
                  next_version="$(node --input-type=module --eval 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version);')"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json
                  git commit -m "updated(release): bump version to $next_version"
                  git push origin HEAD:main
